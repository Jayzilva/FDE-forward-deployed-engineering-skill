<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">Six classification axes</title>
  <desc id="d">Phase, environment, product, engagement model, starting point and delivery style, with their values. The skill infers each axis before it acts.</desc>
  <rect width="1200" height="600" fill="#1C1D1F"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text transform="translate(1158 40) rotate(90)" fill="#EDEDED" font-size="13">02.   classification</text>
    <text x="56" y="112" fill="#EDEDED" font-size="72" font-weight="500" letter-spacing="-2">Six</text>
    <text x="176" y="112" fill="#8A8D91" font-size="72" font-weight="300" letter-spacing="-2">_axes</text>
    <text x="760" y="70" fill="#8A8D91" font-size="13">*The skill infers each axis from the request and the</text>
    <text x="760" y="88" fill="#8A8D91" font-size="13">repository, states its assumptions in one line,</text>
    <text x="760" y="106" fill="#8A8D91" font-size="13">then loads only the playbook that fits.</text>
    <g font-size="15">
      <line x1="60" y1="160" x2="1100" y2="160" stroke="#3A3D41"/>
      <text x="60" y="200" fill="#8A8D91" font-size="13">01</text><text x="120" y="202" fill="#EDEDED" font-size="26" font-weight="500">Phase</text><text x="460" y="200" fill="#8A8D91">discover · scope · prototype · build · validate · handoff</text>
      <line x1="60" y1="230" x2="1100" y2="230" stroke="#3A3D41"/>
      <text x="60" y="270" fill="#8A8D91" font-size="13">02</text><text x="120" y="272" fill="#EDEDED" font-size="26" font-weight="500">Environment</text><text x="460" y="270" fill="#8A8D91">cloud · regulated · on-prem · air-gapped</text>
      <line x1="60" y1="300" x2="1100" y2="300" stroke="#3A3D41"/>
      <text x="60" y="340" fill="#8A8D91" font-size="13">03</text><text x="120" y="342" fill="#EDEDED" font-size="26" font-weight="500">Product</text><text x="460" y="340" fill="#8A8D91">ai-agent · claude-code · data-platform · api-integration · business-app</text>
      <line x1="60" y1="370" x2="1100" y2="370" stroke="#3A3D41"/>
      <text x="60" y="410" fill="#8A8D91" font-size="13">04</text><text x="120" y="412" fill="#EDEDED" font-size="26" font-weight="500">Engagement model</text><text x="460" y="410" fill="#8A8D91">external · internal · programme · partner</text>
      <line x1="60" y1="440" x2="1100" y2="440" stroke="#3A3D41"/>
      <text x="60" y="480" fill="#8A8D91" font-size="13">05</text><text x="120" y="482" fill="#EDEDED" font-size="26" font-weight="500">Starting point</text><text x="460" y="480" fill="#8A8D91">greenfield · prototype-exists · legacy-replace · rescue · scale-out</text>
      <line x1="60" y1="510" x2="1100" y2="510" stroke="#3A3D41"/>
      <text x="60" y="550" fill="#8A8D91" font-size="13">06</text><text x="120" y="552" fill="#EDEDED" font-size="26" font-weight="500">Delivery style</text><text x="460" y="550" fill="#8A8D91">classic (tickets) · spec-driven (spec, plan, build, verify)</text>
      <line x1="60" y1="580" x2="1100" y2="580" stroke="#3A3D41"/>
    </g>
    <rect x="904" y="388" width="196" height="30" fill="#B5F23D"/>
    <text x="916" y="409" fill="#1C1D1F" font-size="14" font-weight="500">new in 1.x : axes 04–06</text>
  </g>
</svg>
