<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Six FDE phases and the artifacts each produces</title><desc id="d">Discover, scope, prototype, build, validate and handoff, each with its artifacts. Client notes from the prototype flow back into scope.</desc><defs>
