<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Six FDE phases and the artifacts each one produces</title>
  <desc id="d">Discover, Scope, Prototype, Build, Validate and Handoff, with a feedback loop from Prototype back to Scope.</desc>
  <rect width="1200" height="420" rx="24" fill="#F6F8FB"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8C97A5"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker></defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="52" fill="#16202B" font-size="24" font-weight="800">Six phases, one artifact trail</text>
    <text x="40" y="80" fill="#56606C" font-size="15">Every phase ends in something the client can act on. Prototype feedback flows back into scope until the journeys are confirmed.</text>
    <g stroke="#8C97A5" stroke-width="2" marker-end="url(#a)"><path d="M216 190H232"/><path d="M406 190H422"/><path d="M596 190H612"/><path d="M786 190H802"/><path d="M976 190H992"/></g>
    <path d="M510 142 C510 104 320 104 320 140" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#b)"/>
    <text x="415" y="100" text-anchor="middle" fill="#D97706" font-size="13" font-weight="700">client notes</text>
    <g font-size="13">
      <g transform="translate(40 146)"><rect width="176" height="232" rx="16" fill="#fff" stroke="#D5DCE5"/><rect width="176" height="8" rx="4" fill="#2B59C3"/><text x="16" y="40" fill="#2B59C3" font-size="12" font-weight="700" letter-spacing="1.5">1 DISCOVER</text><text x="16" y="66" fill="#16202B" font-size="15" font-weight="700">Ground truth</text><text x="16" y="96" fill="#56606C">Site survey</text><text x="16" y="118" fill="#56606C">System map</text><text x="16" y="140" fill="#56606C">Competitor profiles</text><text x="16" y="162" fill="#56606C">Discovery questions</text></g>
      <g transform="translate(232 146)"><rect width="176" height="232" rx="16" fill="#fff" stroke="#D5DCE5"/><rect width="176" height="8" rx="4" fill="#0F766E"/><text x="16" y="40" fill="#0F766E" font-size="12" font-weight="700" letter-spacing="1.5">2 SCOPE</text><text x="16" y="66" fill="#16202B" font-size="15" font-weight="700">The slice to close</text><text x="16" y="96" fill="#56606C">Gap matrix</text><text x="16" y="118" fill="#56606C">Requirement IDs</text><text x="16" y="140" fill="#56606C">Outcome card</text><text x="16" y="162" fill="#56606C">Migration ADR</text><text x="16" y="184" fill="#56606C">Executive brief</text></g>
      <g transform="translate(422 146)"><rect width="176" height="232" rx="16" fill="#FFF8E6" stroke="#F5C542" stroke-width="2"/><rect width="176" height="8" rx="4" fill="#D97706"/><text x="16" y="40" fill="#B45309" font-size="12" font-weight="700" letter-spacing="1.5">3 PROTOTYPE</text><text x="16" y="66" fill="#16202B" font-size="15" font-weight="700">Show, then build</text><text x="16" y="96" fill="#56606C">Separate version</text><text x="16" y="118" fill="#56606C">Spotlight tour</text><text x="16" y="140" fill="#56606C">Guided tour doc</text><text x="16" y="162" fill="#56606C">Client notes loop</text></g>
      <g transform="translate(612 146)"><rect width="176" height="232" rx="16" fill="#fff" stroke="#D5DCE5"/><rect width="176" height="8" rx="4" fill="#7C3AED"/><text x="16" y="40" fill="#7C3AED" font-size="12" font-weight="700" letter-spacing="1.5">4 BUILD</text><text x="16" y="66" fill="#16202B" font-size="15" font-weight="700">Minimum architecture</text><text x="16" y="96" fill="#56606C">One spec per change</text><text x="16" y="118" fill="#56606C">Evals</text><text x="16" y="140" fill="#56606C">ADR</text><text x="16" y="162" fill="#56606C">Risk register</text></g>
      <g transform="translate(802 146)"><rect width="176" height="232" rx="16" fill="#fff" stroke="#D5DCE5"/><rect width="176" height="8" rx="4" fill="#BE185D"/><text x="16" y="40" fill="#BE185D" font-size="12" font-weight="700" letter-spacing="1.5">5 VALIDATE</text><text x="16" y="66" fill="#16202B" font-size="15" font-weight="700">Prove the value</text><text x="16" y="96" fill="#56606C">Pilot plan</text><text x="16" y="118" fill="#56606C">ROI scorecard</text><text x="16" y="140" fill="#56606C">Demo checklist</text><text x="16" y="162" fill="#56606C">Evaluation pack</text></g>
      <g transform="translate(992 146)"><rect width="168" height="232" rx="16" fill="#fff" stroke="#D5DCE5"/><rect width="168" height="8" rx="4" fill="#0369A1"/><text x="16" y="40" fill="#0369A1" font-size="12" font-weight="700" letter-spacing="1.5">6 HANDOFF</text><text x="16" y="66" fill="#16202B" font-size="15" font-weight="700">Leave it running</text><text x="16" y="96" fill="#56606C">Runbook</text><text x="16" y="118" fill="#56606C">Champion plan</text><text x="16" y="140" fill="#56606C">Old way switched off</text></g>
    </g>
  </g>
</svg>
