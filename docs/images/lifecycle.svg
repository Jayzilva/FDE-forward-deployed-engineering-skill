<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Six FDE phases and the artifacts each produces</title>
  <desc id="d">Discover, scope, prototype, build, validate and handoff. Client notes from the prototype flow back into scope.</desc>
  <rect width="1200" height="560" fill="#1C1D1F"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text transform="translate(1158 40) rotate(90)" fill="#EDEDED" font-size="13">03.   lifecycle</text>
    <text x="56" y="112" fill="#EDEDED" font-size="72" font-weight="500" letter-spacing="-2">Six</text>
    <text x="176" y="112" fill="#8A8D91" font-size="72" font-weight="300" letter-spacing="-2">_phases</text>
    <text x="760" y="70" fill="#8A8D91" font-size="13">*Every phase ends in an artifact the client</text>
    <text x="760" y="88" fill="#8A8D91" font-size="13">can act on. Prototype notes return to scope</text>
    <text x="760" y="106" fill="#8A8D91" font-size="13">until the journeys are confirmed.</text>
    <line x1="60" y1="210" x2="1100" y2="210" stroke="#EDEDED" stroke-width="1.5"/>
    <g fill="#EDEDED"><circle cx="60" cy="210" r="4"/><circle cx="234" cy="210" r="4"/><circle cx="408" cy="210" r="4"/><circle cx="582" cy="210" r="4"/><circle cx="756" cy="210" r="4"/><circle cx="930" cy="210" r="4"/></g>
    <circle cx="408" cy="210" r="7" fill="#B5F23D"/>
    <path d="M408 196 C408 156 234 156 234 196" fill="none" stroke="#B5F23D" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M228 188 L234 198 L240 188" fill="none" stroke="#B5F23D" stroke-width="1.5"/>
    <text x="321" y="152" text-anchor="middle" fill="#B5F23D" font-size="12">client notes</text>
    <g font-size="14" fill="#8A8D91">
      <text x="60" y="252" font-size="12">01</text><text x="60" y="284" fill="#EDEDED" font-size="24" font-weight="500">Discover</text>
      <text x="60" y="318">Site survey</text><text x="60" y="340">System map</text><text x="60" y="362">Competitor profiles</text><text x="60" y="384">Discovery questions</text>
      <text x="234" y="252" font-size="12">02</text><text x="234" y="284" fill="#EDEDED" font-size="24" font-weight="500">Scope</text>
      <text x="234" y="318">Gap matrix</text><text x="234" y="340">Requirement IDs</text><text x="234" y="362">Outcome card</text><text x="234" y="384">Migration ADR</text><text x="234" y="406">Executive brief</text>
      <text x="408" y="252" font-size="12">03</text><text x="408" y="284" fill="#EDEDED" font-size="24" font-weight="500">Prototype</text>
      <text x="408" y="318">Separate version</text><text x="408" y="340" fill="#EDEDED">FSPARK feedback</text><text x="408" y="362">Guided tour document</text><text x="408" y="384">Notes loop</text>
      <text x="582" y="252" font-size="12">04</text><text x="582" y="284" fill="#EDEDED" font-size="24" font-weight="500">Build</text>
      <text x="582" y="318">One spec per change</text><text x="582" y="340">Evals</text><text x="582" y="362">ADR</text><text x="582" y="384">Risk register</text>
      <text x="756" y="252" font-size="12">05</text><text x="756" y="284" fill="#EDEDED" font-size="24" font-weight="500">Validate</text>
      <text x="756" y="318">Pilot plan</text><text x="756" y="340">ROI scorecard</text><text x="756" y="362">Demo checklist</text><text x="756" y="384">Evaluation pack</text>
      <text x="930" y="252" font-size="12">06</text><text x="930" y="284" fill="#EDEDED" font-size="24" font-weight="500">Handoff</text>
      <text x="930" y="318">Runbook</text><text x="930" y="340">Champion plan</text><text x="930" y="362">Old way switched off</text>
    </g>
    <rect x="408" y="440" width="244" height="30" fill="#B5F23D"/>
    <text x="420" y="461" fill="#1C1D1F" font-size="14" font-weight="500">show : then build</text>
    <line x1="60" y1="500" x2="1100" y2="500" stroke="#3A3D41"/>
    <text x="60" y="530" fill="#8A8D91" font-size="13">Done means released and adopted: the old way is switched off for that domain.</text>
  </g>
</svg>
