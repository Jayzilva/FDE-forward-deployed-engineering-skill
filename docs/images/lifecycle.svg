<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Six FDE phases and the artifacts each produces</title><desc id="d">Discover, scope, prototype, build, validate and handoff, each with its artifacts. Client notes from the prototype flow back into scope.</desc><rect width="1200" height="700" fill="#1B1C1E"/><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2A2B2E" stroke-width="1"/></pattern></defs><rect width="1200" height="700" fill="url(#g)"/><text x="40" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#ECECEA" text-anchor="start" letter-spacing="0.4">LIFECYCLE</text><text x="40" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#8B8E93" text-anchor="start" letter-spacing="0.4">CUTAWAY</text><text x="300" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#ECECEA" text-anchor="start" letter-spacing="0.4">SIX PHASES</text><text x="300" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#8B8E93" text-anchor="start" letter-spacing="0.4">ONE ARTIFACT EACH</text><text x="560" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#ECECEA" text-anchor="start" letter-spacing="0.4">SERIES 1.4 / 07</text><text x="560" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#8B8E93" text-anchor="start" letter-spacing="0.4">SHEET 03 OF 07</text><text x="820" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#ECECEA" text-anchor="start" letter-spacing="0.4">FEEDBACK PATH</text><text x="820" y="50" font-family=