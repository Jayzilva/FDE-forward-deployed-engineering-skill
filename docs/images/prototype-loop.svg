" font-weight="700">confirms · change · new · out</text></g><g transform="rotate(0 190.0 581.0)"><rect x="45" y="557" width="300" height="58" fill="#111111"/><rect x="40" y="552" width="300" height="58" fill="#FFD23F" stroke="#111111" stroke-width="3"/><circle cx="68" cy="578" r="18" fill="#111111" stroke="#111111" stroke-width="3"/><text x="68" y="584.48" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="17.099999999999998" fill="#B5F23D" text-anchor="middle">07</text><text x="98" y="586" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="20" fill="#111111" text-anchor="start">SEND vN+1</text><text x="290" y="585" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="1" fill="#111111" text-anchor="start"></text><text x="98" y="604" font-family="Courier New, Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="700">what changed because of you</text></g><path d="M660 600 C 720 600, 720 200, 660 200" fill="none" stroke="#111111" stroke-width="6" stroke-dasharray="12 8" marker-end="url(#ah)"/><g transform="rotate(90 676 380)"><rect x="676" y="380" width="72" height="28" fill="#B5F23D" stroke="#111111" stroke-width="3"/><text x="686" y="398" font-family="Courier New, Courier, monospace" font-size="14" fill="#111111" text-anchor="start" font-weight="700">REPEAT</text></g><g transform="rotate(1 951.0 398.0)"><rect x="766" y="182" width="390" height="452" fill="#111111"/><rect x="756" y="172" width="390" height="452" fill="#FFFFFF" stroke="#111111" stroke-width="4"/><text x="780" y="210" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="22" fill="#111111" text-anchor="start">SHARE BY AUDIENCE</text><rect x="780" y="236" width="340" height="64" fill="#7EE0C3" stroke="#111111" stroke-width="3"/><text x="796" y="264" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="17" fill="#111111" text-anchor="start">In your organisation</text><text x="796" y="288" font-family="Courier New, Courier, monospace" font-size="14" fill="#111111" text-anchor="start" font-weight="700">Claude artifact, org sharing</text><rect x="780" y="318" width="340" height="64" fill="#FFD23F" stroke="#111111" stroke-width="3"/><text x="796" y="346" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="17" fill="#111111" text-anchor="start">Outside, links allowed</text><text x="796" y="370" font-family="Courier New, Courier, monospace" font-size="14" fill="#111111" text-anchor="start" font-weight="700">public artifact link</text><rect x="780" y="400" width="340" height="64" fill="#FF5DA2" stroke="#111111" stroke-width="3"/><text x="796" y="428" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="17" fill="#111111" text-anchor="start">Outside, no Claude</text><text x="796" y="452" font-family="Courier New, Courier, monospace" font-size="14" fill="#111111" text-anchor="start" font-weight="700">one offline HTML file</text><rect x="780" y="482" width="340" height="64" fill="#FF7A1A" stroke="#111111" stroke-width="3"/><text x="796" y="510" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="17" fill="#111111" text-anchor="start">Regulated</text><text x="796" y="534" font-family="Courier New, Courier, monospace" font-size="14" fill="#111111" text-anchor="start" font-weight="700">client's approved channel only</text></g><g transform="translate(900 158) rotate(-5)"><polygon points="0.0,0.0 110.0,0.0 106.0,4.3 110.0,8.7 106.0,13.0 110.0,17.3 106.0,21.7 110.0,26.0 0.0,26.0 4.0,21.7 0.0,17.3 4.0,13.0 0.0,8.7 4.0,4.3" fill="#FFF4A8" opacity=".82" stroke="#111111" stroke-opacity=".25"/></g><g transform="rotate(12 1110 110)"><polygon points="1168.0,110.0 1154.8,122.0 1160.2,139.0 1142.8,142.8 1139.0,160.2 1122.0,154.8 1110.0,168.0 1098.0,154.8 1081.0,160.2 1077.2,142.8 1059.8,139.0 1065.2,122.0 1052.0,110.0 1065.2,98.0 1059.8,81.0 1077.2,77.2 1081.0,59.8 1098.0,65.2 1110.0,52.0 1122.0,65.2 1139.0,59.8 1142.8,77.2 1160.2,81.0 1154.8,98.