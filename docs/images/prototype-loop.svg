<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">Prototype feedback loop with a spotlight tour</title>
  <desc id="d">Build the next version, add a spotlight tour, check every stop, share by audience, collect notes, triage them, update requirement IDs, send the next version.</desc>
  <rect width="1200" height="620" fill="#1C1D1F"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text transform="translate(1158 40) rotate(90)" fill="#EDEDED" font-size="13">04.   prototype loop</text>
    <text x="56" y="112" fill="#EDEDED" font-size="72" font-weight="500" letter-spacing="-2">Feedback</text>
    <text x="378" y="112" fill="#8A8D91" font-size="72" font-weight="300" letter-spacing="-2">_loop</text>
    <text x="760" y="70" fill="#8A8D91" font-size="13">*add_spotlight.py turns any HTML prototype</text>
    <text x="760" y="88" fill="#8A8D91" font-size="13">into a step-by-step tour. One stop per new</text>
    <text x="760" y="106" fill="#8A8D91" font-size="13">feature. Each stop takes a viewer note.</text>
    <g font-size="14" fill="#8A8D91">
      <line x1="60" y1="160" x2="640" y2="160" stroke="#3A3D41"/>
      <text x="60" y="196" font-size="12">01</text><text x="110" y="198" fill="#EDEDED" font-size="22" font-weight="500">Build vN</text><text x="330" y="196">sample data, "new" badges</text>
      <line x1="60" y1="220" x2="640" y2="220" stroke="#3A3D41"/>
      <text x="60" y="256" font-size="12">02</text><text x="110" y="258" fill="#EDEDED" font-size="22" font-weight="500">Spotlight</text><text x="330" y="256">data-tour targets, steps.json</text>
      <line x1="60" y1="280" x2="640" y2="280" stroke="#3A3D41"/>
      <text x="60" y="316" font-size="12">03</text><text x="110" y="318" fill="#EDEDED" font-size="22" font-weight="500">Check</text><text x="330" y="316">every stop, desktop and phone</text>
      <line x1="60" y1="340" x2="640" y2="340" stroke="#3A3D41"/>
      <text x="60" y="376" font-size="12">04</text><text x="110" y="378" fill="#EDEDED" font-size="22" font-weight="500">Share</text><text x="330" y="376">by audience, see right</text>
      <line x1="60" y1="400" x2="640" y2="400" stroke="#3A3D41"/>
      <text x="60" y="436" font-size="12">05</text><text x="110" y="438" fill="#EDEDED" font-size="22" font-weight="500">Notes</text><text x="330" y="436">"copy my notes" or comments</text>
      <line x1="60" y1="460" x2="640" y2="460" stroke="#3A3D41"/>
      <text x="60" y="496" font-size="12">06</text><text x="110" y="498" fill="#EDEDED" font-size="22" font-weight="500">Triage</text><text x="330" y="496">confirms · change · new · out</text>
      <line x1="60" y1="520" x2="640" y2="520" stroke="#3A3D41"/>
      <text x="60" y="556" font-size="12">07</text><text x="110" y="558" fill="#EDEDED" font-size="22" font-weight="500">Send vN+1</text><text x="330" y="556">"what changed because of you"</text>
      <line x1="60" y1="580" x2="640" y2="580" stroke="#3A3D41"/>
    </g>
    <path d="M660 558 H690 V196 H660" fill="none" stroke="#B5F23D" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M668 190 L660 196 L668 202" fill="none" stroke="#B5F23D" stroke-width="1.5"/>
    <line x1="760" y1="170" x2="760" y2="560" stroke="#EDEDED" stroke-width="1.5"/>
    <text x="780" y="182" fill="#8A8D91" font-size="12">SHARE BY AUDIENCE</text>
    <g font-size="14" fill="#8A8D91">
      <text x="780" y="230" fill="#EDEDED" font-size="20" font-weight="500">In your organisation</text><text x="780" y="254">Claude artifact, org sharing</text>
      <text x="780" y="310" fill="#EDEDED" font-size="20" font-weight="500">Outside, links allowed</text><text x="780" y="334">Public artifact link</text>
      <text x="780" y="390" fill="#EDEDED" font-size="20" font-weight="500">Outside, no Claude</text><text x="780" y="414">One offline HTML file</text>
      <text x="780" y="470" fill="#EDEDED" font-size="20" font-weight="500">Regulated</text><text x="780" y="494">Client's approved channel only</text>
    </g>
    <rect x="780" y="522" width="240" height="30" fill="#B5F23D"/>
    <text x="792" y="543" fill="#1C1D1F" font-size="14" font-weight="500">0 external requests : offline</text>
  </g>
</svg>
