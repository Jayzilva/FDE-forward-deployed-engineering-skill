etica, sans-serif" font-size="17.099999999999998" fill="#FFD23F" text-anchor="middle">02</text><text x="398" y="276" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="20" fill="#111111" text-anchor="start">FSPARK</text><text x="570" y="275" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="1" fill="#111111" text-anchor="start"></text><text x="398" y="294" font-family="Courier New, Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="700">data-tour targets + config</text></g><g transform="rotate(0 190.0 333.0)"><rect x="45" y="309" width="300" height="58" fill="#111111"/><rect x="40" y="304" width="300" height="58" fill="#FFD23F" stroke="#111111" stroke-width="3"/><circle cx="68" cy="330" r="18" fill="#111111" stroke="#111111" stroke-width="3"/><text x="68" y="336.48" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="17.099999999999998" fill="#B5F23D" text-anchor="middle">03</text><text x="98" y="338" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="20" fill="#111111" text-anchor="start">CHECK</text><text x="270" y="337" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="1" fill="#111111" text-anchor="start"></text><text x="98" y="356" font-family="Courier New, Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="700">every stop, desktop + phone</text></g><g transform="rotate(0 490.0 395.0)"><rect x="345" y="371" width="300" height="58" fill="#111111"/><rect x="340" y="366" width="300" height="58" fill="#FFFFFF" stroke="#111111" stroke-width="3"/><circle cx="368" cy="392" r="18" fill="#111111" stroke="#111111" stroke-width="3"/><text x="368" y="398.48" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="17.099999999999998" fill="#FFD23F" text-anchor="middle">04</text><text x="398" y="400" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="20" fill="#111111" text-anchor="start">SHARE</text><text