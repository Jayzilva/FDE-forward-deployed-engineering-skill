xt></g><g transform="rotate(0 788.0 441.0)"><rect x="719" y="269" width="152" height="358" fill="#111111"/><rect x="712" y="262" width="152" height="358" fill="#B5F23D" stroke="#111111" stroke-width="4"/><text x="724" y="296" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="17" fill="#111111" text-anchor="start">ACCEPTED</text><text x="724" y="320" font-family="Courier New, Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="700">name + date</text><text x="724" y="337" font-family="Courier New, Courier, monospace" font-size="12" fill="#111111" text-anchor="start" font-weight="700">+ source</text><text x="724" y="604" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="30" fill="#111111" text-anchor="start" opacity=".25">05</text></g><text x="40" y="652" font-family="Courier New, Courier, monospace" font-size="15" fill="#111111" text-anchor="start" font-weight="700">five states, never merged in one sentence. a local pass is not an outcome.</text><g transform="rotate(2 1025.0 340.0)"><rect x="889" y="209" width="290" height="280" fill="#111111"/><rect x="880" y="200" width="290" height="280" fill="#FFF9E6" stroke="#111111" stroke-width="4"/><text x="900" y="232" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="18" fill="#111111" text-anchor="start">VALUE LEDGER ROW</text><rect x="900" y="262" width="250" height="40" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="910" y="278" font-family="Courier New, Courier, monospace" font-size="11" fill="#555555" text-anchor="start" font-weight="700">measured</text><text x="910" y="295" font-family="Courier New, Courier, monospace" font-size="14" fill="#111111" text-anchor="start" font-weight="700">3.5h (was 9h)</text><rect x="900" y="312" width="250" height="40" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="910" y="328" font-family="Courier New, Courier, monospace" font-size="11" fill="#555555" text-anchor="start" font-weight="700">accepted by</text><text x="910" y="345" font-family="Courier New, Courier, monospace" font-size="14" fill="#111111" text-anchor="start" font-weight="700">Priya Shah, 2026-11-14</text><rect x="900" y="362" width="250" height="40" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="910" y="378" font-family="Courier New, Courier, monospace" font-size="11" fill="#555555" text-anchor="start" font-weight="700">status</text><text x="910" y="395" font-family="Courier New, Courier, monospace" font-size="14" fill="#111111" text-anchor="start" font-weight="700">accepted</text><rect x="900" y="412" width="250" height="40" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="910" y="428" font-family="Courier New, Courier, monospace" font-size="11" fill="#555555" text-anchor="start" font-weight="700">evidence</text><text x="910" y="445" font-family="Courier New, Courier, monospace" font-size="14" fill="#111111" text-anchor="start" font-weight="700">PR #42 · readout notes</text></g><g transform="translate(980 186) rotate(6)"><polygon points="0.0,0.0 100.0,0.0 96.0,4.3 100.0,8.7 96.0,13.0 100.0,17.3 96.0,21.7 100.0,26.0 0.0,26.0 4.0,21.7 0.0,17.3 4.0,13.0 0.0,8.7 4.0,4.3" fill="#FFF4A8" opacity=".82" stroke="#111111" stroke-opacity=".25"/></g><g transform="rotate(-14 1010 560)"><rect x="880" y="520" width="260" height="78" fill="none" stroke="#E0262E" stroke-width="7"/><rect x="890" y="530" width="240" height="58" fill="none" stroke="#E0262E" stroke-width="2"/><text x="1010" y="574" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="22" fill="#E0262E" text-anchor="middle">NO SIGNER = CLAIM</text></g><g transform="rotate(-8 650 236)"><polygon points="706.0,236.0 693.3,247.6 698.5,264.0 681.7,267.7 678.0,284.5 661.6,279.3 650.0,292.0 638.4,279.3 622.0,284.5 618.3,267.7 601.5,264.0 606.7,247.6 594.0,236.0 606.7,224.4 601.5,208.0 618.3,204.3 622.0,187.5 638.4,192.7 650.0,180.0 661.6,192.7 678.0,187.5 681.7,204.3 698.5,208.0 693.3,224.4" transform="tr