="800" y1="360" x2="800" y2="348" stroke="#141414" stroke-width="1"/><rect x="40.0" y="370" width="144.0" height="34" rx="0" fill="none" stroke="#141414" stroke-width="1"/><text x="50.0" y="392" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="500" fill="#141414" text-anchor="start">01</text><text x="40.0" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-0.3">IMPLEMENTED</text><text x="40.0" y="456" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start">commit · PR</text><line x1="40.0" y1="468" x2="40.0" y2="488" stroke="#141414" stroke-width="1"/><rect x="192.0" y="370" width="144.0" height="34" rx="0" fill="none" stroke="#141414" stroke-width="1"/><text x="202.0" y="392" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="500" fill="#141414" text-anchor="start">02</text><text x="192.0" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-0.3">VERIFIED</text><text x="192.0" y="456" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start">test output + revision</text><line x1="192.0" y1="468" x2="192.0" y2="488" stroke="#141414" stroke-width="1"/><rect x="344.0" y="370" width="144.0" height="34" rx="0" fill="none" stroke="#141414" stroke-width="1"/><text x="354.0" y="392" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="500" fill="#141414" text-anchor="start">03</text><text x="344.0" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-0.3">DEPLOYED</text><text x="344.0" y="456" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start">release record</text><line x1="344.0" y1="468" x2="344.0" y2="488" stroke="#141414" stroke-width="1"/><rect x="496.0" y="370" width="144.0" height="34" rx="0" fill="none" stroke="#141414" stroke-width="1"/><text x="506.0" y="392" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="500" fill="#141414" text-anchor="start">04</text><text x="496.0" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-0.3">MEASURED</text><text x="496.0" y="456" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start">baseline vs now</text><line x1="496.0" y1="468" x2="496.0" y2="488" stroke="#141414" stroke-width="1"/><rect x="648.0" y="370" width="144.0" height="34" rx="0" fill="#C8F53B" stroke="#141414" stroke-width="1"/><text x="658.0" y="392" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="500" fill="#141414" text-anchor="start">05</text><text x="648.0" y="434" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-0.3">ACCEPTED</text><text x="648.0" y="456" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start">name + date + source</text><line x1="648.0" y1="468" x2="648.0" y2="488" stroke="#141414" stroke-width="1"/><path d="M708.0 350l-7 -12h14z" fill="#141414"/><text x="708.0" y="330" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="10" font-weight="500" fill="#141414" text-anchor="middle">ONLY THIS STATE COUNTS AS DONE</text><text x="40" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#141414" text-anchor="start">A local pass is not an outcome. A demo is not a launch.</text><text x="40" y="554" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">A transcript that says “approved” approves nothing.</text><rect x="850" y="120" width="310" height="400" rx="0" fill="none" stroke="#141414" stroke-width="1"/><text x="866" y="146" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start">VALUE LEDGER ROW</text><text x="1144" y="146" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="end">VL-01</text><line x1="850" y1="160" x2="1160" y2="160" stroke="#141414" stroke-width="1"/><text x="866" y="200" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="10" font-weight="400" fill="#6B6B6B" text-anchor="start">MEASURED</text><text x="866" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#141414" text-anchor="start">3.5 h  (baseline 9 h)</text><line x1="866" y1="244" x2="1144" y2="244" stroke="#CFCFC9" stroke-width="1"/><text x="866" y="272" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="10" font-weight="400" fill="#6B6B6B" text-anchor="start">ACCEPTED BY</text><text x="866" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#141414" text-anchor="start">Priya Shah, 2026-11-14</text><line x1="866" y1="316" x2="1144" y2="316" stroke="#CFCFC9" stroke-width="1"/><text x="866" y="344" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="10" font-weight="400" fill="#6B6B6B" text-anchor="start">STATUS</text><rect x="866" y="355" width="84" height="26" rx="0" fill="#C8F53B"/><text x="874" y="375" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="14" font-weight="500" fill="#141414" text-anchor="start">accepted</text><line x1="866" y1="388" x2="1144" y2="388" stroke="#CFCFC9" stroke-width="1"/><text x="866" y="416" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="10" font-weight="400" fill="#6B6B6B" text-anchor="start">EVIDENCE</text><text x="866" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#141414" text-anchor="start">PR #42 · readout notes</text><line x1="866" y1="460" x2="1144" y2="460" stroke="#CFCFC9" stroke-width="1"/><rect x="850" y="530" width="310" height="44" rx="0" fill="#141414"/><text x="1005" y="558" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="15" font-weight="500" fill="#EDEDE9" text-anchor="middle">NO SIGNER = CLAIM</text><text x="900" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="200" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-10" opacity="0.08">05</text><line x1="40" y1="676" x2="1160" y2="676" stroke="#141414" stroke-width="1"/><text x="40" y="698" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0.4">python scripts/evidence_check.py fde/  --strict  --export</text><text x="1160" y="698" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="end" letter-spacing="0.4">RECORDED FIELDS ONLY. NOT PROOF OF CONSENT</text></svg>