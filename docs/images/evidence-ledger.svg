<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Evidence ledger: five delivery states and acceptance</title><desc id="d">Implemented, verified, deployed, measured and accepted, each with its evidence. A value-ledger row is accepted only with a measured value, a named client signer, a date and a source. Otherwise it is a claim.</desc><rect width="1200" height="720" fill="#EDEDE9"/><text x="40" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.4">EVIDENCE LEDGER</text><text x="40" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0.4">NEW IN 1.4</text><text x="300" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.4">FIVE STATES</text><text x="300" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0.4">NEVER MERGED</text><text x="560" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.4">SERIES 1.4 / 07</text><text x="560" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0.4">SHEET 06 OF 07</text><text x="820" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.4">RULE</text><text x="820" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0.4">NO SIGNER = CLAIM</text><text x="1160" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="end" letter-spacing="0.4">06</text><line x1="40" y1="64" x2="1160" y2="64" stroke="#141414" stroke-width="1"/><text x="34" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="140" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-6">CLAIM</text><text x="500" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="60" font-weight="300" fill="#6B6B6B" text-anchor="start" letter-spacing="-2">_OR</text><text x="36" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" font-weight="300" fill="#141414" text-anchor="start" letter-spacing="-2">ACCEPTED?</text><line x1="40" y1="360" x2="800" y2="360" stroke="#141414" stroke-width="2"/><line x1="40" y1="360" x2="40" y2="348" stroke="#141414" stroke-width="1"/><line x1="59" y1="360" x2="59" y2="354" stroke="#141414" stroke-width="1"/><line x1="78" y1="360" x2="78" y2="354" stroke="#141414" stroke-width="1"/><line x1="97" y1="360" x2="97" y2="354" stroke="#141414" stroke-width="1"/><line x1="116" y1="360" x2="116" y2="354" stroke="#141414" stroke-width="1"/><line x1="135" y1="360" x2="135" y2="354" stroke="#141414" stroke-width="1"/><line x1="154" y1="360" x2="154" y2="354" stroke="#141414" stroke-width="1"/><line x1="173" y1="360" x2="173" y2="354" stroke="#141414" stroke-width="1"/><line x1="192" y1="360" x2="192" y2="348" stroke="#141414" stroke-width="1"/><line x1="211" y1="360" x2="211" y2="354" stroke="#141414" stroke-width="1"/><line x1="230" y1="360" x2="230" y2="354" stroke="#141414" stroke-width="1"/><line x1="249" y1="360" x2="249" y2="354" stroke="#141414" stroke-width="1"/><line x1="268" y1="360" x2="268" y2="354" stroke="#141414" stroke-width="1"/><line x1="287" y1="360" x2="287" y2="354" stroke="#141414" stroke-width="1"/><line x1="