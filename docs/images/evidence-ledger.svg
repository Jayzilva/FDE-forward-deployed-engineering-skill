<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Evidence ledger: five delivery states and acceptance</title><desc id="d">Implemented, verified, deployed, measured and accepted, each with its evidence. A value-ledger row is accepted only with a measured value, a named client signer, a date and a source. Otherwise it is a claim.</desc><defs>
