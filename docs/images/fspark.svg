<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">FSPARK: Feedback-based Spotlight Presentation, Assessment, Response and Knowledge</title><desc id="d">Four modules: presentation with a spotlight tour, assessment with a reaction per feature, response with notes and closing questions, knowledge as a Markdown feedback file merged across reviewers.</desc><rect width="1200" height="700" fill="#EDEDE9"/><text x="40" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.4">FEEDBACK</text><text x="40" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0.4">MECHANISM</text><text x="300" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.4">ONE HTML FILE</text><text x="300" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0.4">NO EXTERNAL REQUESTS</text><text x="560" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.4">SERIES 1.4 / 07</text><text x="560" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0.4">SHEET 05 OF 07</text><text x="820" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.4">OUTPUT</text><text x="820" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0.4">MARKDOWN FILE</text><text x="1160" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="end" letter-spacing="0.4">05</text><line x1="40" y1="64" x2="1160" y2="64" stroke="#141414" stroke-width="1"/><text x="34" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="160" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-7">FSPARK</text><text x="1080" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="-1">P—</text><text x="1080" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="-1">A—</text><text x="1080" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="-1">R—</text><text x="1080" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="-1">K</text><line x1="40" y1="250" x2="700" y2="250" stroke="#141414" stroke-width="1"/><text x="40" y="270" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start">FEEDBACK-BASED SPOTLIGHT</text><text x="300" y="270" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start">PRESENTATION · ASSESSMENT</text><text x="560" y="270" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start">RESPONSE &amp; KNOWLEDGE</text><line x1="40" y1="480" x2="1160" y2="480" stroke="#141414" stroke-width="1"/><rect x="40" y="330" width="262" height="300" rx="0" fill="n