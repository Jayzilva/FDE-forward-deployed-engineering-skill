<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Six classification axes</title><desc id="d">Phase, environment, product, engagement model, starting point and delivery style, with their values. The skill infers each axis before it acts.</desc><rect width="1200" height="720" fill="#EDEDE9"/><text x="40" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.4">CLASSIFICATION</text><text x="40" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0.4">SYSTEM</text><text x="300" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.4">INFERRED FROM</text><text x="300" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0.4">REQUEST + REPOSITORY</text><text x="560" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.4">SERIES 1.4 / 07</text><text x="560" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0.4">SHEET 02 OF 07</text><text x="820" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="0.4">ASK ONLY WHEN</text><text x="820" y="50" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0.4">THE ANSWER CHANGES</text><text x="1160" y="34" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="11" font-weight="500" fill="#141414" text-anchor="end" letter-spacing="0.4">02</text><line x1="40" y1="64" x2="1160" y2="64" stroke="#141414" stroke-width="1"/><text x="36" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="112" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-4">SIX AXES</text><text x="1100" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="-1">AX—</text><text x="1100" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="-1">ES</text><text x="1100" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="-1">06</text><line x1="40" y1="206" x2="700" y2="206" stroke="#141414" stroke-width="1"/><text x="40" y="226" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="10" font-weight="500" fill="#141414" text-anchor="start">PARAMETER</text><text x="130" y="226" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="10" font-weight="500" fill="#141414" text-anchor="start">AXIS</text><text x="380" y="226" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="10" font-weight="500" fill="#141414" text-anchor="start">WHY IT MATTERS</text><text x="40" y="262" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="13" font-weight="500" fill="#141414" text-anchor="start">01</text><text x="130" y="264" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-0.5">Phase</text><text x="380" y="262" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start">decides the playbook</text><text x="130" y="288" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="400" fill="#141414" text-anchor="start">discover · scope · prototype · build · validate · handoff</text><line x1="40" y1="302" x2="700" y2="302" stroke="#CFCFC9" stroke-width="1"/><text x="40" y="330" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="13" font-weight="500" fill="#141414" text-anchor="start">02</text><text x="130" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-0.5">Environment</text><text x="380" y="330" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start">moves security to week one</text><text x="130" y="356" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="400" fill="#141414" text-anchor="start">cloud · regulated · on-prem · air-gapped</text><line x1="40" y1="370" x2="700" y2="370" stroke="#CFCFC9" stroke-width="1"/><text x="40" y="398" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="13" font-weight="500" fill="#141414" text-anchor="start">03</text><text x="130" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-0.5">Product</text><text x="380" y="398" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start">sets metrics and evals</text><text x="130" y="424" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="400" fill="#141414" text-anchor="start">ai-agent · claude-code · data-platform · api-integration · business-app</text><line x1="40" y1="438" x2="700" y2="438" stroke="#CFCFC9" stroke-width="1"/><text x="40" y="466" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="13" font-weight="500" fill="#141414" text-anchor="start">04</text><text x="130" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-0.5">Engagement model</text><text x="380" y="466" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start">decides who signs off</text><text x="130" y="492" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="400" fill="#141414" text-anchor="start">external · internal · programme · partner</text><line x1="40" y1="506" x2="700" y2="506" stroke="#CFCFC9" stroke-width="1"/><text x="40" y="534" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="13" font-weight="500" fill="#141414" text-anchor="start">05</text><text x="130" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-0.5">Starting point</text><text x="380" y="534" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start">changes the first two weeks</text><text x="130" y="560" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="400" fill="#141414" text-anchor="start">greenfield · prototype-exists · legacy-replace · rescue · scale-out</text><line x1="40" y1="574" x2="700" y2="574" stroke="#CFCFC9" stroke-width="1"/><text x="40" y="602" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="13" font-weight="500" fill="#141414" text-anchor="start">06</text><text x="130" y="604" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#141414" text-anchor="start" letter-spacing="-0.5">Delivery style</text><text x="380" y="602" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start">sets the tracking unit</text><text x="130" y="628" font-family="SFMono-Regular, Consolas, Menlo, Courier New, monospace" font-size="12" font-weight="400" fill="#141414" text-anchor="start">classic (tickets) · spec-driven (spec, plan, build, verify)</text><line x1="40" y1="642" x2="700" y2="642" stroke="#141414" stroke-width="1"/><line x1="724" y1="226" x2="734" y2="226" stroke="#141414" stroke-width="1"/><line x1="724" y1="238" x2="729" y2="238" stroke="#141414" stroke-width="1"/><line x1="724" y1="250" x2="729" y2="250" stroke="#141414" stroke-width="1"/><line x1="724" y1="262" x2="729" y2="262" stroke="#141414" stroke-width="1"/><line x1="724" y1="274" x2="729" y2="274" stroke="#141414" stroke-width="1"/><line x1="724" y1="286" x2="734" y2="286" stroke="#141414" stroke-width="1"/><line x1="724" y1="298" x2="729" y2="298" stroke="#141414" stroke-width="1"/><line x1="724" y1="310" x2="729" y2="310" stroke="#141414" stroke-width="1"/><line x1="724" y1="322" x2="729" y2="322" stroke="#141414" stroke-width="1"/><line x1="724" y1="334" x2="729" y2="334" stroke="#141414" stroke-width="1"/><line x1="724" y1="346" x2="734" y2="346" stroke="#141414" stroke-width="1"/><line x1="724" y1="358" x2="729" y2="358" stroke="#141414" stroke-width="1"/><line x1="724" y1="370" x2="729" y2="370" stroke="#141414" stroke-width="1"/><line x1="724" y1="382" x2="729" y2="382" stroke="#141414" stroke-width="1"/><line x1="724" y1="394" x2="729" y2="394" stroke="#141414" stroke-width="1"/><line x1="724" y1="406" x2="734" y2="406" stroke="#141414" stroke-width="1"/><line x1="724" y1="418" x2="729" y2="418" stroke="#141414" stroke-width="1"/><line x1="724" y1="430" x2="729" y2="430" stroke="#141414" stroke-wi