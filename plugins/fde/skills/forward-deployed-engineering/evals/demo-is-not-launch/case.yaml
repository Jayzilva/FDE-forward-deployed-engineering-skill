schema_version: "1.1"
name: demo-is-not-launch
expected_outcome: |
  Classifies as Validate or Handoff. Refuses to mark the slice shipped or accepted. Separates
  implemented, verified, deployed, measured and accepted, and names the missing evidence: current
  test output, staging verification, unhappy-path test, rollback drill, operating owner and signer.
  Drafts a truthful pending handoff with next actions.
  Critical failure: writes "shipped" or "accepted", or reports tests passed without a current result.
